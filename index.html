<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חידון קיימות וסביבה 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0d1b2a;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center;align-items:center}
.screen{display:none;width:100%;max-width:800px;margin:auto;padding:24px;min-height:100vh;flex-direction:column;justify-content:center;align-items:center}
.screen.active{display:flex}
.start-screen{text-align:center}
.start-screen h1{font-size:2.2em;color:#66BB6A;margin-bottom:12px}
.start-screen .leaf{font-size:4em;margin-bottom:16px}
.start-screen p{font-size:1.15em;color:#aaa;margin-bottom:30px;line-height:1.7}
.exams-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:560px;margin:0 auto 28px}
.exam-card{background:#1b2838;border:2px solid #2a3a4a;border-radius:14px;padding:20px 16px;cursor:pointer;transition:all .25s;text-align:center}
.exam-card:hover{border-color:#66BB6A;transform:translateY(-3px);box-shadow:0 6px 20px rgba(102,187,106,.25)}
.exam-card.selected{border-color:#66BB6A;background:#1b3d20}
.exam-card .exam-icon{font-size:2em;margin-bottom:8px}
.exam-card .exam-name{font-size:1.15em;font-weight:bold;color:#fff;margin-bottom:4px}
.exam-card .exam-desc{font-size:.85em;color:#aaa;line-height:1.4}
.start-btn{background:linear-gradient(135deg,#43A047,#66BB6A);color:#fff;border:none;padding:16px 44px;font-size:1.2em;font-weight:bold;border-radius:14px;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}
.start-btn:hover:not(:disabled){transform:scale(1.06);box-shadow:0 6px 24px rgba(102,187,106,.4)}
.start-btn:disabled{opacity:.4;cursor:default}
.random-btn{background:linear-gradient(135deg,#7B1FA2,#AB47BC);margin-right:12px}
.random-btn:hover:not(:disabled){box-shadow:0 6px 24px rgba(171,71,188,.4)}
.btns-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.quiz-screen{justify-content:flex-start;padding-top:20px}
.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.q-counter{font-size:1.1em;color:#81C784}
.exam-label{font-size:.9em;color:#AB47BC;margin-top:2px}
.timer-wrap{position:relative;width:72px;height:72px}
.timer-ring{transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:#1b2838;stroke-width:5}
.timer-fg{fill:none;stroke:#66BB6A;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5em;font-weight:bold;color:#66BB6A}
.timer-wrap.warn .timer-fg{stroke:#FF7043}
.timer-wrap.warn .timer-text{color:#FF7043}
.timer-wrap.danger .timer-fg{stroke:#ef5350}
.timer-wrap.danger .timer-text{color:#ef5350}
.progress-bar{width:100%;height:8px;background:#1b2838;border-radius:8px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#43A047,#66BB6A);border-radius:8px;transition:width .4s}
.q-type-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:.85em;font-weight:bold;margin-bottom:16px}
.badge-tf{background:#1565C0;color:#fff}
.badge-mc{background:#7B1FA2;color:#fff}
.q-card{background:#1b2838;border-radius:16px;padding:28px 30px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.3);margin-bottom:20px}
.q-text{font-size:1.2em;font-weight:bold;line-height:1.7;color:#fff}
.options-grid{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
.opt-btn{background:#162232;border:2px solid #2a3a4a;border-radius:12px;padding:14px 20px;font-size:1.05em;color:#e0e0e0;cursor:pointer;transition:all .2s;text-align:right;line-height:1.5}
.opt-btn:hover:not(.locked){background:#1e3048;border-color:#66BB6A;transform:translateX(-4px)}
.opt-btn.selected-correct{background:#2E7D32!important;border-color:#43A047!important;color:#fff!important}
.opt-btn.selected-wrong{background:#c62828!important;border-color:#ef5350!important;color:#fff!important}
.opt-btn.reveal-correct{border-color:#43A047!important;background:#1b3d20!important}
.opt-btn.locked{cursor:default;opacity:.7}
.opt-btn.locked.selected-correct,.opt-btn.locked.selected-wrong,.opt-btn.locked.reveal-correct{opacity:1}
.feedback-box{width:100%;padding:16px 20px;border-radius:12px;margin-top:4px;font-size:1em;line-height:1.6;display:none}
.feedback-box.show{display:block}
.feedback-box.correct-fb{background:#1b3d20;color:#A5D6A7;border:1px solid #2E7D32}
.feedback-box.wrong-fb{background:#3d1b1b;color:#ef9a9a;border:1px solid #c62828}
.feedback-box.timeout-fb{background:#3d2e1b;color:#FFE0B2;border:1px solid #E65100}
.next-btn{background:linear-gradient(135deg,#1565C0,#42A5F5);color:#fff;border:none;padding:14px 40px;font-size:1.1em;font-weight:bold;border-radius:12px;cursor:pointer;margin-top:16px;transition:transform .2s;display:none}
.next-btn.show{display:inline-block}
.next-btn:hover{transform:scale(1.05)}
.result-screen{text-align:center}
.result-screen h2{font-size:2em;color:#66BB6A;margin-bottom:8px}
.result-circle{width:180px;height:180px;margin:20px auto;position:relative}
.result-ring{transform:rotate(-90deg)}
.result-bg{fill:none;stroke:#1b2838;stroke-width:10}
.result-fg{fill:none;stroke:#66BB6A;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.5s ease}
.result-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.8em;font-weight:bold;color:#66BB6A}
.result-msg{font-size:1.2em;color:#aaa;margin:16px 0 8px}
.result-stars{font-size:2.2em;margin-bottom:24px}
.result-stats{display:flex;gap:24px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
.stat-box{background:#1b2838;padding:16px 24px;border-radius:12px;text-align:center;min-width:120px}
.stat-val{font-size:1.8em;font-weight:bold;color:#66BB6A}
.stat-label{font-size:.9em;color:#888;margin-top:4px}
.restart-btn{background:linear-gradient(135deg,#43A047,#66BB6A);color:#fff;border:none;padding:16px 44px;font-size:1.2em;font-weight:bold;border-radius:14px;cursor:pointer;transition:transform .2s}
.restart-btn:hover{transform:scale(1.06)}
@media(max-width:600px){
.screen{padding:14px;min-height:auto}
.start-screen h1{font-size:1.5em}
.start-screen p{font-size:1em;margin-bottom:18px}
.exams-grid{grid-template-columns:repeat(2,1fr);gap:8px;max-width:100%}
.exam-card{padding:14px 10px}
.exam-card .exam-icon{font-size:1.5em;margin-bottom:4px}
.exam-card .exam-name{font-size:1em}
.exam-card .exam-desc{font-size:.75em}
.btns-row{flex-direction:column;gap:10px;width:100%}
.start-btn,.random-btn{width:100%;padding:14px;font-size:1.1em}
.top-bar{flex-wrap:wrap;gap:8px}
.q-counter{font-size:1em}
.timer-wrap{width:56px;height:56px}
.timer-ring{width:56px;height:56px}
.timer-text{font-size:1.2em}
.q-card{padding:18px 16px}
.q-text{font-size:1.05em;line-height:1.6}
.opt-btn{padding:12px 14px;font-size:.95em}
.feedback-box{font-size:.9em;padding:12px 14px}
.next-btn{width:100%;padding:12px;font-size:1em}
.result-circle{width:140px;height:140px}
.result-ring{width:140px;height:140px}
.result-num{font-size:2.2em}
.result-stats{gap:12px}
.stat-box{padding:12px 16px;min-width:90px}
.stat-val{font-size:1.4em}
.restart-btn{width:100%;padding:14px}
}
</style>
</head>
<body>

<div class="screen start-screen active" id="startScreen">
    <div class="leaf">🌿</div>
    <h1>חידון קיימות וסביבה</h1>
    <p>בחרו מבחן מהרשימה · 20 שאלות · ⏱ 20 שניות לכל שאלה</p>
    <div class="exams-grid" id="examsGrid"></div>
    <div class="btns-row">
        <button class="start-btn random-btn" id="randomBtn" onclick="startRandom()" disabled>🎲 מבחן אקראי</button>
        <button class="start-btn" id="startBtn" onclick="startExam()" disabled>התחילו!</button>
    </div>
</div>

<div class="screen quiz-screen" id="quizScreen">
    <div class="top-bar">
        <div><span class="q-counter" id="qCounter"></span><div class="exam-label" id="examLabel"></div></div>
        <div class="timer-wrap" id="timerWrap">
            <svg class="timer-ring" width="72" height="72" viewBox="0 0 72 72">
                <circle class="timer-bg" cx="36" cy="36" r="30"/>
                <circle class="timer-fg" id="timerFg" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="0"/>
            </svg>
            <div class="timer-text" id="timerText">20</div>
        </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div id="badgeArea"></div>
    <div class="q-card"><div class="q-text" id="qText"></div></div>
    <div class="options-grid" id="optsGrid"></div>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">השאלה הבאה ←</button>
</div>

<div class="screen result-screen" id="resultScreen">
    <h2>סיימתם את החידון!</h2>
    <div class="result-circle">
        <svg class="result-ring" width="180" height="180" viewBox="0 0 180 180">
            <circle class="result-bg" cx="90" cy="90" r="76"/>
            <circle class="result-fg" id="resFg" cx="90" cy="90" r="76" stroke-dasharray="477.5" stroke-dashoffset="477.5"/>
        </svg>
        <div class="result-num" id="resNum"></div>
    </div>
    <div class="result-stars" id="resStars"></div>
    <div class="result-msg" id="resMsg"></div>
    <div class="result-stats">
        <div class="stat-box"><div class="stat-val" id="statCorrect">0</div><div class="stat-label">תשובות נכונות</div></div>
        <div class="stat-box"><div class="stat-val" id="statWrong">0</div><div class="stat-label">תשובות שגויות</div></div>
        <div class="stat-box"><div class="stat-val" id="statTimeout">0</div><div class="stat-label">פג הזמן</div></div>
    </div>
    <button class="restart-btn" onclick="goHome()">חזרה לדף הבית</button>
</div>

<script>
// ======== ALL QUESTIONS ========

var EXAM_1 = [
{type:"tf",text:'מדידת "טביעת רגל אקולוגית" כוללת אך ורק את השטח הנחוץ לגידול הפירות והירקות שאנו צורכים.',answer:false,explain:'טביעת רגל אקולוגית כוללת מדדים רבים נוספים, כמו השטח הנחוץ לגידול כותנה לבגדים, וכן משאבים הנחוצים באנרגיה ומים.'},
{type:"tf",text:'על פי מחקרים, אם קצב זיהום האוקיינוסים יימשך כפי שהוא, עד שנת 2050 יהיה בים יותר פלסטיק מאשר דגים.',answer:true,explain:'לפחות 8 מיליון טונות של פלסטיק מושלכים לאוקיינוס בכל שנה. עד 2050 יהיה יותר פלסטיק מדגים.'},
{type:"tf",text:'לפי המלצות חברת החשמל להתייעלות אנרגטית, בקיץ יש לכוון את המזגן לטמפרטורה של 18-20 מעלות.',answer:false,explain:'חברת החשמל ממליצה בקיץ ל-22-25 מעלות, ובחורף ל-18-20 מעלות.'},
{type:"tf",text:'בקבוק זכוכית שמושלך לפח הרגיל ומגיע להטמנה בקרקע, צפוי להישאר שם כמיליון שנים מבלי להתפרק.',answer:true,explain:'זמן ההתכלות של בקבוק זכוכית מוערך במיליון (1,000,000) שנים.'},
{type:"tf",text:'קומפוסט יכול להיווצר רק בתהליך מיחזור מלאכותי במתקנים ייעודיים של הרשות המקומית.',answer:false,explain:'קומפוסט נוצר גם בתהליך טבעי על ידי חרקים, פטריות וחיידקים המפרקים חומר אורגני.'},
{type:"tf",text:'ציפור המיינה המצויה נחשבת למין פולש מכיוון שהיא נוהגת לפלוש לקינים של ציפורים אחרות ולסלק את הביצים שלהן.',answer:true,explain:'המיינה פולשת לקיניהם של מינים מקומיים ומסלקת את הביצים שלהם.'},
{type:"tf",text:'תנשמת המשמשת לציד מכרסמים בשדות חקלאיים היא דוגמה ל"הדברה ביולוגית" שנועדה לצמצם שימוש ברעלים.',answer:true,explain:'התנשמת ניזונה ממכרסמים ומסייעת לחקלאים לצמצם שימוש בחומרי הדברה כימיים.'},
{type:"tf",text:'מתקן ה"ביופילטר" מטהר מי גשמים באמצעות הוספת כימיקלים וכלור לפני שהמים מחלחלים למי התהום.',answer:false,explain:'הביופילטר מטהר באמצעות חילחול טבעי דרך שכבות חול וצמחים, ללא כימיקלים.'},
{type:"tf",text:'עץ הניטע בסמוך לבית מגורים יכול לסייע בהפחתת הטמפרטורה בסביבתו בעד כארבע מעלות בימי הקיץ.',answer:true,explain:'עץ מעניק צל ובולם רעשים, ומפחית את הטמפרטורה בסביבתו בעד ארבע מעלות.'},
{type:"tf",text:'מי נגר עירוני (מי גשמים שלא מחלחלים) מהווים רק בעיה של "בזבוז מים" אך אינם גורמים לנזק או לזיהום כשהם נשפכים לים.',answer:false,explain:'מי הנגר סוחפים חומרים רעילים ומזהמים שנשטפים לחופים וגורמים נזקים כבדים לים.'},
{type:"tf",text:'כחמישית מכמות המים המתוקים בעולם נמצאת מתחת לפני הקרקע, במי תהום.',answer:true,explain:'מי תהום הם מים מתחת לקרקע שחילחלו ונעצרו בשכבת סלע אטומה, ובהם כחמישית מהמים המתוקים.'},
{type:"tf",text:'מוביל המים הארצי הוקם במקור במטרה להוביל מים מותפלים מהים התיכון אל אזור הצפון.',answer:false,explain:'מוביל המים הארצי הוקם ב-1951 להוביל מים מהכנרת וממקורות בצפון אל הדרום והנגב.'},
{type:"tf",text:'במכון לטיהור שפכים (מט"ש) ניתן להשתמש בגז המתאן שנפלט מהשפכים על מנת לייצר חשמל.',answer:true,explain:'במט"ש ניתן לייצר חשמל מגז המתאן שנפלט מהשפכים.'},
{type:"tf",text:'"אחו לח" (אגן ירוק) היא שיטה טבעית לטיהור שפכים המבוססת על בריכה עם צמחי מים וטוף.',answer:true,explain:'"אחו לח" היא שיטה טבעית לטיהור שפכים באמצעות בריכה עם צמחי מים וטוף.'},
{type:"tf",text:'"חוק האריזות" מטיל את האחריות למיחזור האריזה אך ורק על הצרכן שקנה את המוצר.',answer:false,explain:'חוק האריזות מטיל את האחריות על החברות המסחריות שמייצרות את המוצרים.'},
{type:"tf",text:'על פי החוק, חובה להפריד פסולת אלקטרונית (כמו מטענים וטלפונים ישנים) לפח נפרד כדי שתעבור למפעלי מיחזור.',answer:true,explain:'חוק פסולת אלקטרונית קובע חובת הפרדה לפח נפרד.'},
{type:"tf",text:'משפחה ישראלית ממוצעת בת ארבע נפשות משליכה לפח מעל טון של מזון בשנה.',answer:true,explain:'משפחה ישראלית ממוצעת משליכה מזון במשקל של יותר מטון בשנה (כמשקל היפופוטם).'},
{type:"tf",text:'התנים בארץ הם טורפים הפעילים בעיקר בשעות היום וניזונים אך ורק מבשר ציד.',answer:false,explain:'התנים פעילים בלילה, והם אוכלי-כל הניזונים מיונקים קטנים, נבלות, פירות ופסולת.'},
{type:"tf",text:'הדורבנים חופרים מערכת מחילות מפותלת שקצהָ יכול להגיע לכמעט שני מטרים מתחת לפני האדמה, מה שמבודד אותם מפגעי מזג האוויר.',answer:true,explain:'הדורבנים חופרים מחילות לעומק כמעט שני מטרים, המבודדות מחום, קור, גשם ורוח.'},
{type:"tf",text:'בשל מיקומה הגיאוגרפי של ישראל בגבול של שלוש יבשות, היא נחשבת לאחד הצמתים המרכזיים בעולם עבור עופות נודדים.',answer:true,explain:'ישראל ממוקמת בגבול אסיה, אפריקה ואירופה – צומת מרכזי לעופות נודדים.'}
];

var EXAM_2 = [

    {name:'מבחן 1', icon:'🌱', desc:'מושגי יסוד בקיימות וסביבה', questions:EXAM_1},
    {name:'מבחן 2', icon:'💧', desc:'מים, אופנה, חיות בר ויוזמות', questions:EXAM_2},
    {name:'מבחן 3', icon:'♻️', desc:'חוקים, מיחזור וטבע עירוני', questions:EXAM_3},
    {name:'מבחן 4', icon:'🐝', desc:'חקיקה סביבתית, חיות ויוזמות אקולוגיות', questions:EXAM_4},
    {name:'מבחן 5', icon:'🌍', desc:'מים, טביעת רגל, פסולת ומיחזור', questions:EXAM_5},

    {name:'פרטים קטנים', icon:'🧠', desc:'המבחן הסופי – מספרים, דוגמאות ופרטים חבויים', questions:EXAM_DETAILS}
];

var selectedExam=-1, quiz=[], current=0, score=0, wrongCount=0, timeoutCount=0, timer=null, timeLeft=20, currentExamName='';
var CIRC=188.5;

function buildExamCards(){
    var g=document.getElementById('examsGrid');
    g.innerHTML='';
    for(var i=0;i<EXAMS.length;i++){
        var e=EXAMS[i];
        var d=document.createElement('div');
        d.className='exam-card';
        d.setAttribute('data-idx',i);
        d.innerHTML='<div class="exam-icon">'+e.icon+'</div><div class="exam-name">'+e.name+'</div><div class="exam-desc">'+e.desc+'</div><div class="exam-desc" style="margin-top:6px;color:#81C784">'+e.questions.length+' שאלות</div>';
        d.onclick=function(){selectExam(parseInt(this.getAttribute('data-idx')))};
        g.appendChild(d);
    }
}

function selectExam(idx){
    selectedExam=idx;
    document.querySelectorAll('.exam-card').forEach(function(c,i){c.classList.toggle('selected',i===idx)});
    document.getElementById('startBtn').disabled=false;
    document.getElementById('randomBtn').disabled=false;
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});document.getElementById(id).classList.add('active')}

function startExam(){
    if(selectedExam<0)return;
    var e=EXAMS[selectedExam];
    currentExamName=e.name;
    quiz=shuffle(e.questions.slice()).slice(0,20);
    current=0;score=0;wrongCount=0;timeoutCount=0;
    showScreen('quizScreen');
    showQuestion();
}

function startRandom(){
    currentExamName='מבחן אקראי';
    var all=[];
    for(var i=0;i<EXAMS.length;i++) all=all.concat(EXAMS[i].questions);
    shuffle(all);
    quiz=all.slice(0,20);
    current=0;score=0;wrongCount=0;timeoutCount=0;
    showScreen('quizScreen');
    showQuestion();
}

function showQuestion(){
    var q=quiz[current];
    var total=quiz.length;
    document.getElementById('qCounter').textContent='שאלה '+(current+1)+' מתוך '+total;
    document.getElementById('examLabel').textContent=currentExamName;
    document.getElementById('progFill').style.width=((current)/total*100)+'%';
    document.getElementById('qText').textContent=q.text;
    var badge=document.getElementById('badgeArea');
    badge.innerHTML=q.type==='tf'?'<span class="q-type-badge badge-tf">נכון / לא נכון</span>':'<span class="q-type-badge badge-mc">רב-ברירה</span>';
    var grid=document.getElementById('optsGrid');
    grid.innerHTML='';
    if(q.type==='tf'){
        grid.innerHTML='<button class="opt-btn" onclick="pick(this,true)">✔ נכון</button><button class="opt-btn" onclick="pick(this,false)">✘ לא נכון</button>';
    }else{
        var labels=['א','ב','ג','ד','ה','ו'];
        for(var i=0;i<q.options.length;i++){
            var b=document.createElement('button');
            b.className='opt-btn';
            b.textContent=labels[i]+'. '+q.options[i];
            b.setAttribute('data-idx',i);
            b.onclick=function(){pick(this,parseInt(this.getAttribute('data-idx')))};
            grid.appendChild(b);
        }
    }
    document.getElementById('feedbackBox').className='feedback-box';
    document.getElementById('feedbackBox').innerHTML='';
    document.getElementById('nextBtn').className='next-btn';
    startTimer();
}

function startTimer(){
    timeLeft=20;
    var wrap=document.getElementById('timerWrap');
    wrap.className='timer-wrap';
    document.getElementById('timerText').textContent='20';
    document.getElementById('timerFg').style.strokeDashoffset='0';
    clearInterval(timer);
    timer=setInterval(function(){
        timeLeft--;
        document.getElementById('timerText').textContent=timeLeft;
        document.getElementById('timerFg').style.strokeDashoffset=CIRC*(1-timeLeft/20);
        if(timeLeft<=5)wrap.className='timer-wrap danger';
        else if(timeLeft<=10)wrap.className='timer-wrap warn';
        if(timeLeft<=0){clearInterval(timer);onTimeout()}
    },1000);
}

function onTimeout(){
    lockButtons();
    timeoutCount++;
    revealCorrect(quiz[current]);
    var fb=document.getElementById('feedbackBox');
    fb.className='feedback-box timeout-fb show';
    fb.innerHTML='<strong>⏱ נגמר הזמן!</strong> '+quiz[current].explain;
    document.getElementById('nextBtn').className='next-btn show';
}

function pick(btn,val){
    clearInterval(timer);
    lockButtons();
    var q=quiz[current];
    var isCorrect=(q.type==='tf')?(val===q.answer):(val===q.answer);
    var fb=document.getElementById('feedbackBox');
    if(isCorrect){
        score++;
        btn.classList.add('selected-correct');
        fb.className='feedback-box correct-fb show';
        fb.innerHTML='<strong>✓ נכון!</strong> '+q.explain;
    }else{
        wrongCount++;
        btn.classList.add('selected-wrong');
        revealCorrect(q);
        fb.className='feedback-box wrong-fb show';
        fb.innerHTML='<strong>✗ טעות!</strong> '+q.explain;
    }
    document.getElementById('nextBtn').className='next-btn show';
}

function revealCorrect(q){
    var btns=document.querySelectorAll('#optsGrid .opt-btn');
    if(q.type==='tf'){
        if(q.answer===true)btns[0].classList.add('reveal-correct');
        else btns[1].classList.add('reveal-correct');
    }else{
        btns[q.answer].classList.add('reveal-correct');
    }
}

function lockButtons(){
    document.querySelectorAll('#optsGrid .opt-btn').forEach(function(b){b.classList.add('locked');b.onclick=null})
}

function nextQuestion(){
    current++;
    if(current>=quiz.length){showResult()}
    else{showQuestion()}
}

function showResult(){
    showScreen('resultScreen');
    document.getElementById('progFill').style.width='100%';
    var total=quiz.length;
    var pct=score/total;
    document.getElementById('resNum').textContent=score+'/'+total;
    var resFg=document.getElementById('resFg');
    resFg.style.strokeDashoffset='477.5';
    setTimeout(function(){resFg.style.strokeDashoffset=477.5*(1-pct)},100);
    if(pct>=0.9)resFg.style.stroke='#43A047';
    else if(pct>=0.6)resFg.style.stroke='#FFA726';
    else resFg.style.stroke='#ef5350';
    document.getElementById('resNum').style.color=resFg.style.stroke;
    var stars='',msg='';
    if(pct===1){stars='⭐⭐⭐';msg='מושלם! אתם מומחי קיימות אמיתיים!'}
    else if(pct>=0.85){stars='⭐⭐';msg='מעולה! ידע מרשים בנושאי סביבה!'}
    else if(pct>=0.65){stars='⭐';msg='טוב מאוד! עוד קצת ותהיו מומחים!'}
    else if(pct>=0.5){stars='';msg='לא רע, אבל יש מקום לשיפור!'}
    else{stars='';msg='כדאי לחזור ולקרוא עוד על קיימות וסביבה!'}
    document.getElementById('resStars').textContent=stars;
    document.getElementById('resMsg').textContent=msg;
    document.getElementById('statCorrect').textContent=score;
    document.getElementById('statWrong').textContent=wrongCount;
    document.getElementById('statTimeout').textContent=timeoutCount;
}

function goHome(){
    document.getElementById('resFg').style.strokeDashoffset='477.5';
    selectedExam=-1;
    document.querySelectorAll('.exam-card').forEach(function(c){c.classList.remove('selected')});
    document.getElementById('startBtn').disabled=true;
    showScreen('startScreen');
}

buildExamCards();
</script>
